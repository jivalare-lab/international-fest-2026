name: verificar

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  puerta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Puerta de verificacion
        run: node verificar.js
