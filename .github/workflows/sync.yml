name: sincronizar con el formulario

# Lee el formulario, regenera los datos, corre las puertas y ABRE UN PULL
# REQUEST. Nunca publica solo: el ultimo paso lo aprueba una persona.
#
# Dos formas de leer la hoja, en orden de preferencia:
#   1. Variable HOJA_ESTUDIANTES (el enlace normal) + secreto GOOGLE_CREDENCIALES.
#      La hoja sigue PRIVADA. Es la recomendada.
#   2. Secreto FORM_CSV_ESTUDIANTES (una hoja publicada a la web como CSV).

on:
  schedule:
    - cron: '0 */3 * * *'      # cada 3 horas
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Decidir de donde se lee
        id: fuente
        env:
          HOJA_EST: ${{ vars.HOJA_ESTUDIANTES }}
          HOJA_PROG: ${{ vars.HOJA_PROGRAMAS }}
          CSV_EST: ${{ secrets.FORM_CSV_ESTUDIANTES }}
          CSV_PROG: ${{ secrets.FORM_CSV_PROGRAMAS }}
          CREDS: ${{ secrets.GOOGLE_CREDENCIALES }}
        run: |
          if [ -n "$HOJA_EST" ]; then
            if [ -z "$CREDS" ]; then
              echo "::error::Hay variable HOJA_ESTUDIANTES pero falta el secreto GOOGLE_CREDENCIALES."
              exit 1
            fi
            echo "est=$HOJA_EST"  >> "$GITHUB_OUTPUT"
            echo "prog=$HOJA_PROG" >> "$GITHUB_OUTPUT"
            echo "Leyendo la hoja privada con la cuenta de servicio."
          elif [ -n "$CSV_EST" ]; then
            echo "est=$CSV_EST"  >> "$GITHUB_OUTPUT"
            echo "prog=$CSV_PROG" >> "$GITHUB_OUTPUT"
            echo "Leyendo el CSV publicado a la web."
          else
            echo "::error::No hay de donde leer. Configura la variable HOJA_ESTUDIANTES mas el secreto GOOGLE_CREDENCIALES (recomendado), o el secreto FORM_CSV_ESTUDIANTES."
            exit 1
          fi

      - name: Leer el formulario y regenerar los datos
        env:
          GOOGLE_CREDENCIALES: ${{ secrets.GOOGLE_CREDENCIALES }}
        run: |
          node scripts/sync.js \
            --estudiantes "${{ steps.fuente.outputs.est }}" \
            ${{ steps.fuente.outputs.prog && format('--programas "{0}"', steps.fuente.outputs.prog) || '' }}

      # Si los datos nuevos no pasan, el PR no se abre. Un pais sin mapear o un
      # host con basura detiene el proceso aqui y llega el aviso por correo.
      - name: Puerta de verificacion
        run: npm run verificar

      - name: Abrir Pull Request si algo cambio
        uses: peter-evans/create-pull-request@v7
        with:
          branch: sync/formulario
          delete-branch: true
          commit-message: |
            Sincronizar mesas con el formulario

            Generado por scripts/sync.js. Las dos puertas pasaron antes de
            abrir este PR.
          title: 'Mesas nuevas o cambiadas en el formulario'
          body: |
            Cambios detectados en el formulario de inscripcion.

            Las dos puertas (`npm run verificar`) **ya pasaron en verde** sobre
            estos datos: si un pais no se pudiera ubicar en un continente, o un
            nombre de host viniera con basura, este PR no existiria.

            **Revisa el diff de `data/tables.js` antes de mezclar.** Fijate en:

            - nombres de hosts que no parezcan personas
            - paises que hayan caido en el continente equivocado
            - correos con erratas
            - si hay que agregar algo a `data/overrides.json`

            Al mezclar, GitHub Pages publica solo.
          labels: automatico
